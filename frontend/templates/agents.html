<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocIntel AI - Manage Agents</title>
    <meta name="description" content="Create and manage your intelligent RAG agents.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">

    <style>
        /* Page-level overrides for agents management */
        .agents-page-layout {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .agents-page-body {
            flex: 1;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .create-agent-panel {
            background: rgba(15, 15, 30, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            padding: 2rem;
            height: fit-content;
            position: sticky;
            top: 2rem;
        }

        .create-agent-panel h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .create-agent-panel h3 i {
            background: linear-gradient(135deg, #8b5cf6, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-hint {
            color: rgba(255,255,255,0.45);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .field-group {
            margin-bottom: 1.2rem;
        }

        .field-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            margin-bottom: 0.4rem;
        }

        .field-group input,
        .field-group textarea {
            width: 100%;
            background: rgba(15, 15, 35, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.25s;
            resize: vertical;
        }

        .field-group input:focus,
        .field-group textarea:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
            background: rgba(20, 20, 45, 0.9);
        }

        .field-group input::placeholder,
        .field-group textarea::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .error-msg {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .btn-create {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .btn-create:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }

        .btn-create:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Right panel */
        .agents-list-panel h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 1.5rem;
        }

        .agents-grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .agent-mgmt-card {
            background: rgba(15, 15, 30, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.3s;
            position: relative;
        }

        .agent-mgmt-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #8b5cf6, #22d3ee, #34d399);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .agent-mgmt-card:hover {
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .agent-mgmt-card:hover::before {
            opacity: 1;
        }

        .card-top {
            padding: 1.25rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .card-avatar {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a78bfa;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .card-info h4 {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 0.2rem;
        }

        .card-info small {
            color: rgba(255,255,255,0.4);
            font-size: 0.75rem;
        }

        .card-desc {
            padding: 0 1.25rem;
            color: rgba(255,255,255,0.55);
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .card-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: flex-end;
            margin-top: 1rem;
        }

        .btn-del {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.2);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-del:hover {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 4px 15px rgba(239,68,68,0.3);
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: rgba(15, 15, 30, 0.5);
            border: 2px dashed rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            color: rgba(255,255,255,0.4);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        /* Toast notification */
        #toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 0.85rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 9999;
            display: none;
            align-items: center;
            gap: 0.6rem;
            animation: slideUp 0.3s ease;
        }

        #toast.success {
            background: rgba(52,211,153,0.15);
            border: 1px solid rgba(52,211,153,0.4);
            color: #34d399;
        }

        #toast.error {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.4);
            color: #f87171;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        @media (max-width: 900px) {
            .agents-page-body {
                grid-template-columns: 1fr;
            }

            .create-agent-panel {
                position: static;
            }
        }
    </style>
</head>

<body>
    <div id="toast"></div>

    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="agents-page-layout">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-robot"></i>
                    <h1>Agent Management</h1>
                </div>
                <div class="header-actions">
                    <button class="btn-reset" onclick="window.location.href='/'">
                        <i class="fas fa-arrow-left"></i>
                        <span>Back to Chat</span>
                    </button>
                    <button class="btn-reset" onclick="handleLogout()"
                        style="background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:#f87171;">
                        <i class="fas fa-right-from-bracket"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="agents-page-body">

            <!-- Left: Create Agent -->
            <div class="create-agent-panel">
                <h3><i class="fas fa-plus-circle"></i> Create New Agent</h3>
                <p class="form-hint">Each agent has its own isolated document knowledge base (Chroma collection).</p>

                <div class="error-msg" id="createError"></div>

                <div class="field-group">
                    <label for="agentName">Agent Name <span style="color:#ef4444">*</span></label>
                    <input type="text" id="agentName" placeholder="e.g. Legal Docs, HR Policy…"
                        onkeypress="if(event.key==='Enter') createAgent()">
                </div>

                <div class="field-group">
                    <label for="agentDesc">Description <span style="color:rgba(255,255,255,.3)">(optional)</span></label>
                    <textarea id="agentDesc" rows="3" placeholder="What documents will this agent handle?"></textarea>
                </div>

                <button class="btn-create" id="createBtn" onclick="createAgent()">
                    <i class="fas fa-magic"></i> Create Agent
                </button>
            </div>

            <!-- Right: Agents List -->
            <div class="agents-list-panel">
                <h2><i class="fas fa-users-viewfinder me-2" style="opacity:.6;font-size:1.2rem;"></i> Your Agents</h2>
                <div class="agents-grid-cards" id="agentCards">
                    <div class="empty-state">
                        <i class="fas fa-circle-notch fa-spin" style="opacity:.5;"></i>
                        <p>Loading agents…</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Auth must load first -->
    <script src="/static/js/auth.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '/login';
    </script>

    <script>
        // ── Toast ─────────────────────────────────────────────
        function notify(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.className = type;
            t.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${msg}`;
            t.style.display = 'flex';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.style.display = 'none'; }, 4000);
        }

        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // ── Load & Render Agents ──────────────────────────────
        async function loadAgents() {
            const container = document.getElementById('agentCards');
            try {
                const res = await authFetch('/agents');
                if (!res.ok) throw new Error('Server error ' + res.status);
                const agents = await res.json();

                if (!Array.isArray(agents) || agents.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-robot" style="opacity:.4;"></i>
                            <h4 style="color:rgba(255,255,255,.7);">No agents yet</h4>
                            <p>Use the form on the left to create your first agent.</p>
                        </div>`;
                    return;
                }

                container.innerHTML = agents.map(a => `
                    <div class="agent-mgmt-card">
                        <div class="card-top">
                            <div class="card-avatar"><i class="fas fa-robot"></i></div>
                            <div class="card-info">
                                <h4>${escHtml(a.name)}</h4>
                                <small>Created ${new Date(a.created_at).toLocaleDateString()}</small>
                            </div>
                        </div>
                        <div class="card-desc">${escHtml(a.description || 'No description provided.')}</div>
                        <div class="card-footer">
                            <button class="btn-del" onclick="deleteAgent('${a.id}', '${escHtml(a.name).replace(/'/g,"\\'")}')">
                                <i class="fas fa-trash-alt"></i> Delete
                            </button>
                        </div>
                    </div>`).join('');

            } catch (err) {
                console.error('loadAgents error:', err);
                container.innerHTML = `<div class="empty-state" style="border-color:rgba(239,68,68,.3);color:#f87171;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>Failed to load agents. Make sure you are logged in and the backend is running.</p>
                </div>`;
            }
        }

        // ── Create Agent ──────────────────────────────────────
        async function createAgent() {
            const nameEl  = document.getElementById('agentName');
            const descEl  = document.getElementById('agentDesc');
            const btn     = document.getElementById('createBtn');
            const errDiv  = document.getElementById('createError');

            const name = nameEl.value.trim();
            const desc = descEl.value.trim();

            if (!name) {
                errDiv.textContent = 'Agent name is required.';
                errDiv.style.display = 'block';
                nameEl.focus();
                return;
            }
            errDiv.style.display = 'none';

            const orig = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating…';

            try {
                const res = await authFetch('/agents', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description: desc })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Failed to create agent');

                nameEl.value = '';
                descEl.value = '';
                notify(`Agent "${data.name}" created!`, 'success');
                loadAgents(); // Refresh the list
            } catch (e) {
                errDiv.textContent = e.message;
                errDiv.style.display = 'block';
                notify(e.message, 'error');
            } finally {
                btn.innerHTML = orig;
                btn.disabled = false;
            }
        }

        // ── Delete Agent ──────────────────────────────────────
        async function deleteAgent(agentId, agentName) {
            if (!confirm(`Delete agent "${agentName}"? This will remove it and all its document metadata. This cannot be undone.`)) return;

            try {
                const res = await authFetch(`/agents/${agentId}`, { method: 'DELETE' });
                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.detail || 'Delete failed (' + res.status + ')');
                }
                notify(`Agent "${agentName}" deleted.`, 'success');
                loadAgents();
            } catch (e) {
                notify(e.message, 'error');
                console.error('deleteAgent error:', e);
            }
        }

        // ── Init ──────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', loadAgents);
    </script>
</body>
</html>
