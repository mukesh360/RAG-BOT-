<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocIntel AI - Sign Up</title>
    <meta name="description" content="Create your DocIntel AI account">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg-dark: #0a0a0f;
            --bg-card: rgba(20, 20, 35, 0.8);
            --border-color: rgba(139, 92, 246, 0.15);
            --text-primary: #e2e8f0;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated Background */
        .bg-effects {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(99, 102, 241, 0.15));
            top: 10%;
            left: 10%;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(59, 130, 246, 0.1));
            bottom: 10%;
            right: 10%;
            animation-delay: -7s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -20px) scale(1.05);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.95);
            }
        }

        /* Auth Card */
        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo i {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-logo p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .form-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .form-control {
            background: rgba(15, 15, 25, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(15, 15, 25, 0.9);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
            color: var(--text-primary);
        }

        .form-control::placeholder {
            color: #475569;
        }

        .input-group-text {
            background: rgba(15, 15, 25, 0.8);
            border: 1px solid var(--border-color);
            border-right: none;
            color: var(--text-muted);
            border-radius: 12px 0 0 12px;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 12px 12px 0;
        }

        .btn-auth {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }

        .btn-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .alert-auth {
            border-radius: 12px;
            font-size: 0.875rem;
            padding: 0.75rem 1rem;
            border: none;
        }

        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }
    </style>
</head>

<body>
    <!-- Background Effects -->
    <div class="bg-effects">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Signup Card -->
    <div class="auth-card">
        <div class="auth-logo">
            <i class="bi bi-braces-asterisk"></i>
            <h1>DocIntel AI</h1>
            <p>Create your account</p>
        </div>

        <!-- Alert Area -->
        <div id="authAlert" style="display: none;"></div>

        <form id="signupForm" onsubmit="return handleSignupForm(event)">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required
                        minlength="6">
                </div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required
                        minlength="6">
                </div>
            </div>

            <button type="submit" class="btn-auth" id="signupBtn">
                <i class="bi bi-person-plus"></i>
                <span>Create Account</span>
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>

    <!-- Auth JS -->
    <script src="/static/js/auth.js"></script>
    <script>
        // Redirect to chat if already logged in
        if (isLoggedIn()) {
            window.location.href = '/';
        }

        async function handleSignupForm(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('signupBtn');
            const alertDiv = document.getElementById('authAlert');

            // Client-side password match check
            if (password !== confirmPassword) {
                alertDiv.style.display = 'block';
                alertDiv.className = 'alert alert-danger alert-auth mb-3';
                alertDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>Passwords do not match.';
                return false;
            }

            // Disable button and show spinner
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Creating account...';
            alertDiv.style.display = 'none';

            try {
                await handleSignup(email, password);
                // Show success
                alertDiv.style.display = 'block';
                alertDiv.className = 'alert alert-success alert-auth mb-3';
                alertDiv.innerHTML = '<i class="bi bi-check-circle me-2"></i>Account created! Check your email to confirm, then <a href="/login" style="color: inherit; font-weight: 700;">sign in</a>.';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-person-plus"></i> <span>Create Account</span>';
            } catch (error) {
                alertDiv.style.display = 'block';
                alertDiv.className = 'alert alert-danger alert-auth mb-3';
                alertDiv.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>' + error.message;
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-person-plus"></i> <span>Create Account</span>';
            }

            return false;
        }
    </script>
</body>

</html>
